[project]
name = "voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huguittodev", email = "hdelanieta@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
voice = "voice:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
